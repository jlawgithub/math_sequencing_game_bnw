    let shuffledQuestions = [];

    let audioCtx = null;

    // Fisher-Yates 隨機洗牌演算法
    function shuffleArray(array) {
      const arr = JSON.parse(JSON.stringify(array));
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ==========================================
    // 3. Web Audio API 音效 (拍手與音效合成)
    // ==========================================
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playClappingSound() {
      initAudio();
      if (!audioCtx) return;

      const duration = 1.4;
      const now = audioCtx.currentTime;

      // 生成拍手聲音的噪聲
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1100;
      filter.Q.value = 1.2;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, now);

      // 多次脈衝模擬掌聲
      for (let i = 0; i < 22; i++) {
        const time = now + Math.random() * 1.1;
        gain.gain.setValueAtTime(0.35, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.07);
      }

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
      noise.stop(now + duration);

      // 叮咚音階懸律
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.value = freq;

        const startTime = now + idx * 0.1;
        noteGain.gain.setValueAtTime(0.2, startTime);
        noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

        osc.connect(noteGain);
        noteGain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.3);
      });
    }

    function playWrongSound() {

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }

    // ==========================================
    // 4. 遊戲核心邏輯
    // ==========================================

    function loadQuestion() {
      const q = shuffledQuestions[currentQuestionIndex];
      const seqContainer = document.getElementById('sequence-container');
      const optContainer = document.getElementById('options-container');
      const feedbackMsg = document.getElementById('feedback-message');

      feedbackMsg.className = "hidden";
      document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;

      // 更新題目提示文字
      const catCount = q.categories.length;
      document.getElementById('pattern-hint').innerHTML = `<i class="fa-solid fa-lightbulb"></i> 觀察 ${catCount} 個類別的循環規律（長度 ${q.length}）`;

      seqContainer.innerHTML = '';
      optContainer.innerHTML = '';

      // 構建整個題目序列
      const sequence = [];
      for (let i = 0; i < q.length; i++) {
        const catItem = q.categories[i % catCount];
        sequence.push(catItem);
      }

      // 渲染單行序列項目 (嚴格 flex-nowrap 並排)
      sequence.forEach((item, idx) => {
        const isBlank = (idx === q.blankIndex);
        const card = document.createElement('div');
        
        card.className = `flex-1 min-w-0 flex flex-col items-center justify-center py-2 px-0.5 rounded-xl md:rounded-2xl transition-all ${
          isBlank 
            ? 'slot-blank shadow-inner h-20 sm:h-24 md:h-28' 
            : 'bg-white border-2 border-slate-200 shadow-sm hover:border-amber-300 h-20 sm:h-24 md:h-28'
        }`;

        if (isBlank) {
          card.innerHTML = `
            <span class="text-amber-500 font-black text-xl sm:text-2xl md:text-3xl animate-pulse">?</span>
            <div class="w-full h-1 bg-amber-400 rounded-full mt-1 sm:mt-2"></div>
          `;
        } else {
          const iconHtml = item.customIcon 
            ? `<span class="text-xl sm:text-3xl md:text-4xl">${item.customIcon}</span>`
            : `<i class="fa-solid ${item.icon} text-xl sm:text-3xl md:text-4xl ${item.color}" style="${item.rotate ? 'transform: rotate('+item.rotate+');' : ''}"></i>`;

          card.innerHTML = `
            ${iconHtml}
            <span class="text-[9px] sm:text-[11px] md:text-xs font-bold text-slate-600 mt-1 sm:mt-2 text-center truncate w-full">${item.label}</span>
          `;
        }

        seqContainer.appendChild(card);
      });

      // 正確答案在類別中的索引
      const correctAnswerCatIndex = q.blankIndex % catCount;

      // 生成選項按鈕
      q.categories.forEach((catItem, idx) => {
        const btn = document.createElement('button');
        
        btn.className = "bg-white hover:bg-amber-50 border-3 border-amber-200 hover:border-amber-400 p-2.5 sm:p-4 md:p-5 rounded-2xl md:rounded-3xl shadow-md hover:shadow-lg transition-all active:scale-95 flex flex-col items-center justify-center min-w-[75px] sm:min-w-[100px] md:min-w-[120px] group";
        
        const iconHtml = catItem.customIcon 
          ? `<span class="text-2xl sm:text-4xl md:text-5xl group-hover:scale-110 transition-transform">${catItem.customIcon}</span>`
          : `<i class="fa-solid ${catItem.icon} text-2xl sm:text-4xl md:text-5xl ${catItem.color} group-hover:scale-110 transition-transform" style="${catItem.rotate ? 'transform: rotate('+catItem.rotate+');' : ''}"></i>`;

        btn.innerHTML = `
          ${iconHtml}
          <span class="text-[10px] sm:text-xs md:text-sm font-extrabold text-slate-700 mt-1.5 sm:mt-2">${catItem.label}</span>
        `;

        btn.onclick = () => checkAnswer(idx === correctAnswerCatIndex, btn);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(isCorrect, btnElement) {
      const feedbackMsg = document.getElementById('feedback-message');

      if (isCorrect) {
        starsEarned++;
        correctAnswersCount++;
        document.getElementById('star-count').innerText = starsEarned;

        feedbackMsg.innerText = "🎉 答對了！太棒了！";
        feedbackMsg.className = "mb-3 text-center py-2 px-6 rounded-full text-sm sm:text-lg font-black bg-emerald-100 text-emerald-700 border border-emerald-300 block bounce-in max-w-md mx-auto";

        playClappingSound();

        confetti({
          particleCount: 85,
          spread: 70,
          origin: { y: 0.6 }
        });

        disableOptionButtons();

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < shuffledQuestions.length) {
            loadQuestion();
          } else {
            showSummary();
          }
        }, 1500);

      } else {
        playWrongSound();
        feedbackMsg.innerText = "💡 再想一想哦，觀察前面的循環規律！";
        feedbackMsg.className = "mb-3 text-center py-2 px-6 rounded-full text-sm sm:text-lg font-black bg-rose-100 text-rose-700 border border-rose-300 block shake max-w-md mx-auto";

        btnElement.classList.add('shake');
        setTimeout(() => btnElement.classList.remove('shake'), 500);
      }
    }

    function disableOptionButtons() {
      const btns = document.querySelectorAll('#options-container button');
      btns.forEach(b => b.disabled = true);
    }

    function showSummary() {
      document.getElementById('final-correct').innerText = `${correctAnswersCount} / 20`;
      document.getElementById('final-stars').innerText = starsEarned;
      
      const commentEl = document.getElementById('performance-comment');
      if (starsEarned === 20) {
        commentEl.innerText = "🌟 完美全對！超級排列大師！";
      } else if (starsEarned >= 15) {
        commentEl.innerText = "👏 非常棒！規律掌握得很好！";
      } else {
        commentEl.innerText = "👍 繼續加油，再試一次吧！";
      }

      document.getElementById('summary-modal').classList.remove('hidden');

      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    function restartGame() {
      currentQuestionIndex = 0;
      starsEarned = 0;
      correctAnswersCount = 0;
      document.getElementById('star-count').innerText = 0;
      document.getElementById('summary-modal').classList.add('hidden');
      
      // 每次重玩均重新洗牌打亂題目順序
      shuffledQuestions = shuffleArray(originalQuestions);
      loadQuestion();
    }

    function playPromptSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    window.onload = function() {
      // 遊戲初始化：打亂題目順序
      shuffledQuestions = shuffleArray(originalQuestions);
      loadQuestion();
    };
  </script>
</body>
</html>
